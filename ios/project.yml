name: BraviaRemote
options:
  bundleIdPrefix: com.ad3333m
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  BraviaRemote:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: BraviaRemote
        CFBundleName: BraviaRemote
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: BraviaRemote talks to your BRAVIA on your Wi-Fi to switch inputs, open apps and act as a remote.
        NSMicrophoneUsageDescription: Hold the Assistant mic to ask your TV something; your words are turned into text and sent to the TV.
        NSSpeechRecognitionUsageDescription: BraviaRemote turns what you say into text for the TV's Google search.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ad3333m.braviaremote
        PRODUCT_NAME: BraviaRemote
        MARKETING_VERSION: "1.2.0"
        CURRENT_PROJECT_VERSION: "3"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: NO
